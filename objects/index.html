<html>
    <head>
        <title>OBJECTS</title>
    </head>
    <body>
        <style>
        /* 1. Remove scrollbars and default margins */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
            background-color: #111; /* Dark background */
        }
        /* 2. Make the canvas block-level to prevent alignment spaces */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        </style>
        <canvas id="myCanvas"></canvas>
        <script src="./canvas.js"></script>
    </body>
</html>
